<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Class Portal · GCTU MPhil/MSc IT</title>
<meta name="description" content="Check your attendance and confirm your details – GCTU MPhil/MSc Information Technology, January 2026 cohort.">
<link rel="icon" href="assets/gctu-logo.png">
<link rel="apple-touch-icon" href="assets/gctu-logo.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  .profile{display:flex;align-items:center;gap:var(--s4);padding:var(--s4)}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 20px/1 var(--font);flex:none}
  .profile .nm{font:var(--t-title3);letter-spacing:-.01em;overflow-wrap:anywhere}
  .profile .ix{font:500 15px/1.3 var(--mono);color:var(--label-3);letter-spacing:.04em;margin-top:2px}
  .ringcard{display:grid;grid-template-columns:auto 1fr;gap:var(--s5);align-items:center;padding:var(--s5) var(--s4)}
  .ring{width:120px;height:120px;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .pct b{display:block;font:700 28px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ring .pct span{font:var(--t-caption);color:var(--label-3)}
  .legend{display:flex;flex-direction:column;gap:10px}
  .legend div{display:flex;align-items:center;gap:var(--s2);font:var(--t-subhead);color:var(--label-2)}
  .legend i{width:10px;height:10px;border-radius:50%;flex:none}
  .legend b{font:600 17px/1 var(--font);color:var(--label);font-variant-numeric:tabular-nums;margin-left:auto}
  .legend .total{font:var(--t-footnote);color:var(--label-3);padding-top:6px;border-top:.5px solid var(--sep)}
  .ring-arc{transition:stroke-dashoffset 1s var(--ease)}
  @media (prefers-reduced-motion:reduce){.ring-arc{transition:none}}
  .cls .d{font:var(--t-headline)}
  .choice{cursor:pointer}
  .choice .tick{color:var(--accent);visibility:hidden;font-weight:700}
  .choice[aria-checked="true"] .tick{visibility:visible}
  .bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:3px}
  .crow .pc{font:600 17px/1 var(--font);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
  .next{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4)}
  .next .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
  .next.live .dot{background:var(--present);box-shadow:0 0 0 4px var(--present-soft)}
  .tt .time{font:600 15px/1.3 var(--font);font-variant-numeric:tabular-nums;min-width:132px;color:var(--label-2)}
  .tt.now{background:var(--accent-soft)}
  @media (max-width:420px){.tt{flex-wrap:wrap}.tt .time{min-width:0;flex-basis:100%}}
  .empty{padding:var(--s6) var(--s4);text-align:center;color:var(--label-3);font:var(--t-subhead)}
  @media (max-width:380px){.ringcard{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <img class="logo" src="assets/gctu-logo.png" alt="GCTU logo" width="44" height="44">
    <div>
      <div class="org">Ghana Communication Technology University</div>
      <div class="prog">MPhil/MSc. Information Technology · January 2026 Cohort</div>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>
  <p class="footer">Class Portal · Responses go to the class rep and are kept on the class register.</p>
</div>

<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/timetable.js"></script>
<script>
const P = window.Portal, {$, esc} = P;
const app = $("#app");
let me = null;
const KEY = "gctu-idx";
const store = { get(){ try{return localStorage.getItem(KEY)||"";}catch(e){return "";} },
                set(v){ try{ v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY);}catch(e){} } };

/* ───────── lookup ───────── */
function viewLookup(prefill="", error=""){
  me = null;
  app.innerHTML = `
    <div class="fade">
      <h1 class="large-title">Class Portal</h1>
      <p class="lede">Check your attendance after each class, confirm your name and index number, and report anything that's wrong.</p>
      <form id="f" class="stack" novalidate>
        <div class="field">
          <label for="idx">Index number</label>
          <input id="idx" class="input big" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="2526500000" value="${esc(prefill)}" aria-describedby="idxHint">
          <span class="hint" id="idxHint">Digits only, as printed on your student ID.</span>
        </div>
        <div id="err" class="banner err" ${error?"":"hidden"} role="alert"><span class="ic">!</span><span id="errT">${esc(error)}</span></div>
        <button class="btn btn-filled" id="go" type="submit">Continue</button>
      </form>
      <div class="hstack" style="justify-content:center;margin-top:var(--s3)">
        <button class="btn btn-plain" id="missing" type="button">Not on the class list?</button>
      </div>
    </div>`;
  const inp=$("#idx");
  inp.addEventListener("input",()=>{ inp.value=inp.value.replace(/[^\d\s]/g,""); $("#err").hidden=true; });
  if(!prefill) inp.focus({preventScroll:true});
  $("#missing").onclick=()=>sheetMissing(inp.value.replace(/\s+/g,""));
  $("#f").addEventListener("submit", e=>{ e.preventDefault(); lookup(inp.value.replace(/\s+/g,""), $("#go")); });
}

async function lookup(idx, btn){
  const fail = t => { if($("#errT")){ $("#errT").textContent=t; $("#err").hidden=false; } else viewLookup(idx, t); };
  if(!/^\d{8,12}$/.test(idx)) return fail("Enter your full index number using digits only (usually 10 digits).");
  P.busy(btn,true,"Looking you up");
  try{
    const r = await P.call("GET",{action:"lookup", idx});
    if(!r.ok) return fail(P.errText(r.error));
    if(!r.found){ store.set(""); return viewNotFound(idx); }
    me = r; store.set(idx); viewHome();
  }catch(e){ fail(P.errText(e)); }
  finally{ if(document.body.contains(btn)) P.busy(btn,false); }
}

function viewNotFound(idx){
  app.innerHTML = `
    <div class="fade">
      <h1 class="large-title">No match</h1>
      <p class="lede"><span class="mono">${esc(idx)}</span> isn't on the class list. Check the number, or tell the class rep you're missing.</p>
      <div class="stack">
        <button class="btn btn-filled" id="rep" type="button">Report that I'm missing</button>
        <button class="btn btn-gray" id="retry" type="button">Try another number</button>
      </div>
    </div>`;
  $("#retry").onclick=()=>viewLookup(idx);
  $("#rep").onclick=()=>sheetMissing(idx);
}

/* ───────── home ───────── */
function stats(list){
  const c={Present:0,Absent:0,Excused:0,"Not marked":0};
  list.forEach(s=>c[s.status]=(c[s.status]||0)+1);
  const counted=c.Present+c.Absent;
  return {...c, total:list.length, pct: counted? Math.round(c.Present/counted*100) : null};
}
function ring(pct){
  const R=52, C=2*Math.PI*R, off = pct==null ? C : C*(1-pct/100);
  const col = pct==null ? "var(--fill)" : tone(pct);
  return `<div class="ring" role="img" aria-label="${pct==null?"No attendance counted yet":`Attendance ${pct} percent`}">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--fill)" stroke-width="12"/>
      <circle class="ring-arc" cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${off}"/>
    </svg>
    <div class="pct"><div><b>${pct==null?"–":pct+"%"}</b><span>attendance</span></div></div>
  </div>`;
}
function verifyPill(s){
  if(s.status==="Verified") return `<span class="pill ok">Details confirmed</span>`;
  if(s.status==="Correction requested") return `<span class="pill warn">Correction requested</span>`;
  return `<span class="pill none">Not yet confirmed</span>`;
}

const TT=window.TIMETABLE;
function inText(m){ if(m<=0) return "on now"; const d=Math.floor(m/1440), h=Math.floor(m%1440/60), mm=m%60;
  return "in "+(d?`${d} day${d>1?"s":""}${h?` ${h} h`:""}`:h?`${h} h${mm?` ${mm} min`:""}`:`${mm} min`); }
function byCourse(list){
  const g={}; list.forEach(s=>{ const k=s.course; (g[k]=g[k]||{course:k,Present:0,Absent:0,Excused:0,total:0}); g[k][s.status]=(g[k][s.status]||0)+1; g[k].total++; });
  return Object.values(g).map(x=>({...x, pct:(x.Present+x.Absent)?Math.round(x.Present/(x.Present+x.Absent)*100):null}))
    .sort((a,b)=>{ const A=TT.find(a.course), B=TT.find(b.course); return (A?TT.courses.indexOf(A):99)-(B?TT.courses.indexOf(B):99); });
}
const tone = p => p==null?"var(--label-3)":p>=75?"var(--present)":p>=50?"var(--excused)":"var(--absent)";
function timetableHTML(){
  const nx=TT.next(); const order=[6,0,1,2,3,4,5];
  return `
    <h2 class="section-h">Timetable · ${esc(TT.semester)}</h2>
    ${order.filter(d=>TT.courses.some(c=>c.day===d)).map(d=>`
      <div class="group" style="margin-bottom:var(--s3)">
        <div class="row" style="font:var(--t-headline);min-height:40px">${TT.DAYS[d]}</div>
        ${TT.courses.filter(c=>c.day===d).map(c=>`
        <div class="row tt ${nx&&nx.course===c&&nx.live?"now":""}">
          <span class="time">${esc(TT.time(c))}</span>
          <div class="grow"><div>${esc(c.code)} · ${esc(c.title)}</div><div class="sub">${esc(c.lecturer)}${c.venue?` · Venue ${esc(c.venue)}`:""}</div></div>
        </div>`).join("")}
      </div>`).join("")}`;
}
function viewHome(){
  const s=me, st=stats(s.attendance||[]);
  const verified = s.status==="Verified";
  app.innerHTML = `
  <div class="fade">
    <div class="hstack" style="justify-content:space-between;margin-top:var(--s2)">
      <h1 class="large-title" style="margin:var(--s2) 0">My Class</h1>
      <button class="btn btn-plain" id="switch" type="button">Not you?</button>
    </div>

    <div class="group">
      <div class="profile">
        <span class="avatar" aria-hidden="true">${esc(P.initials(s.name))}</span>
        <div style="min-width:0">
          <div class="nm">${esc(s.name)}</div>
          <div class="ix">${esc(s.idx)}</div>
          <div style="margin-top:8px">${verifyPill(s)}</div>
        </div>
      </div>
    </div>

    ${(()=>{ const nx=TT.next(); if(!nx) return ""; const c=nx.course; return `
    <div class="group" style="margin-top:var(--s3)"><div class="next ${nx.live?"live":""}"><span class="dot" aria-hidden="true"></span>
      <div class="grow"><div class="sub">${nx.live?"Class on now":"Next class · "+inText(nx.inMinutes)}</div>
      <div style="font:var(--t-headline)">${esc(c.code)} · ${esc(c.title)}</div>
      <div class="sub">${TT.DAYS[c.day]} ${esc(TT.time(c))}${c.venue?` · Venue ${esc(c.venue)}`:""}</div></div></div></div>`; })()}

    ${verified?"":`
    <p class="section-f" style="margin-top:var(--s3)">Check that your name is spelled correctly and your index number is right, then confirm.</p>`}

    <div class="stack" style="margin-top:var(--s4)">
      ${verified
        ? `<button class="btn btn-tinted" id="confirm" type="button">Update My Email Addresses</button>`
        : `<button class="btn btn-filled" id="confirm" type="button">Confirm My Details</button>`}
      <button class="btn btn-gray" id="report" type="button">Report an Issue</button>
    </div>

    <h2 class="section-h">Attendance</h2>
    <div class="group">
      ${st.total ? `
      <div class="ringcard">
        ${ring(st.pct)}
        <div class="legend">
          <div><i style="background:var(--present)"></i>Present<b>${st.Present}</b></div>
          <div><i style="background:var(--absent)"></i>Absent<b>${st.Absent}</b></div>
          <div><i style="background:var(--excused)"></i>Excused<b>${st.Excused}</b></div>
          <div class="total">${st.total} ${st.total===1?"class":"classes"} recorded${st["Not marked"]?` · ${st["Not marked"]} not marked`:""}</div>
        </div>
      </div>` : `<div class="empty">No classes have been recorded yet. Check back after your next class.</div>`}
    </div>
    ${st.total?`<p class="section-f">Excused classes don't count against you. Tap a class to report a problem with it.</p>`:""}

    ${st.total?`
    <h2 class="section-h">By Course</h2>
    <div class="group">
      ${byCourse(s.attendance).map(x=>`
      <div class="row crow">
        <div class="grow"><div>${esc(x.course)}</div>
          <div class="sub" style="font-size:13px">${x.Present} present · ${x.Absent} absent${x.Excused?` · ${x.Excused} excused`:""}</div>
          <div class="bar" aria-hidden="true"><i style="width:${x.pct??0}%;background:${tone(x.pct)}"></i></div></div>
        <span class="pc" style="color:${tone(x.pct)}">${x.pct==null?"–":x.pct+"%"}</span>
      </div>`).join("")}
    </div>`:""}

    ${st.total?`
    <h2 class="section-h">Classes</h2>
    <div class="group" role="list">
      ${s.attendance.map(c=>`
      <button class="row cls" role="listitem" type="button" data-sid="${esc(c.id)}" aria-label="${esc(P.fmtDate(c.date,true))}, ${esc(c.course)}: ${esc(c.status)}. Report a problem">
        <div class="grow">
          <div class="d">${esc(P.fmtDate(c.date,true))}</div>
          <div class="sub">${esc(c.course)}${c.topic?` · ${esc(c.topic)}`:""}</div>
        </div>
        <span class="pill ${P.pillClass(c.status)}">${esc(c.status)}</span>
      </button>`).join("")}
    </div>`:""}

    ${timetableHTML()}

    <h2 class="section-h">My Details</h2>
    <div class="group">
      <div class="row"><span class="grow">Name</span><span class="val">${esc(s.name)}</span></div>
      <div class="row"><span class="grow">Index No.</span><span class="val mono">${esc(s.idx)}</span></div>
      <div class="row"><span class="grow">School email</span><span class="val">${esc(s.schoolEmail||"—")}</span></div>
      <div class="row"><span class="grow">Personal email</span><span class="val">${esc(s.personalEmail||"—")}</span></div>
    </div>
    <p class="section-f">Something wrong here? Tap Report an Issue and choose Name spelling or Index number.</p>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const a=app.querySelector(".ring-arc"); if(a) a.style.strokeDashoffset=a.dataset.off; }));
  $("#switch").onclick=()=>{ store.set(""); viewLookup(); };
  $("#confirm").onclick=sheetConfirm;
  $("#report").onclick=()=>sheetReport();
  app.querySelectorAll("[data-sid]").forEach(b=>b.onclick=()=>sheetReport("attendance", b.dataset.sid));
}

/* ───────── confirm details ───────── */
function emailFields(school="", personal=""){
  return `
  <div class="field"><label for="eSchool">School email (leave blank if you don't have one yet)</label>
    <input id="eSchool" class="input" type="email" inputmode="email" autocomplete="off" maxlength="120" placeholder="you@gctu.edu.gh" value="${esc(school)}"></div>
  <div class="field"><label for="ePersonal">Personal email</label>
    <input id="ePersonal" class="input" type="email" inputmode="email" autocomplete="email" maxlength="120" placeholder="you@gmail.com" value="${esc(personal)}"></div>`;
}
function readEmails(){
  const school=$("#eSchool").value.trim().toLowerCase(), personal=$("#ePersonal").value.trim().toLowerCase();
  if(!personal) return {error:"Enter your personal email address."};
  if(!P.EMAIL_RE.test(personal)) return {error:"Your personal email doesn't look right."};
  if(school && !P.EMAIL_RE.test(school)) return {error:"Your school email doesn't look right. Check it, or leave it blank."};
  return {schoolEmail:school, personalEmail:personal};
}
function sheetConfirm(){
  const s=me, again = s.status==="Verified";
  P.openSheet({
    title: again ? "Email Addresses" : "Confirm Details",
    left:`<button class="btn btn-plain" data-close type="button">Cancel</button>`,
    body:`
      <div class="group">
        <div class="row"><span class="grow">Name</span><span class="val">${esc(s.name)}</span></div>
        <div class="row"><span class="grow">Index No.</span><span class="val mono">${esc(s.idx)}</span></div>
      </div>
      ${again?"":`<p class="hint" style="margin:-8px 0 0">Confirming means your name is spelled correctly and your index number is right.</p>`}
      <form id="fc" class="stack" novalidate>
        ${emailFields(s.schoolEmail, s.personalEmail)}
        <div id="serr" class="banner err" hidden role="alert"><span class="ic">!</span><span id="serrT"></span></div>
        <button class="btn btn-filled" id="send" type="submit">${again?"Save":"Confirm"}</button>
      </form>`,
    onMount(){
      $("#fc").addEventListener("submit", async e=>{
        e.preventDefault();
        const fail=t=>{ $("#serrT").textContent=t; $("#serr").hidden=false; };
        const em=readEmails(); if(em.error) return fail(em.error);
        const btn=$("#send"); P.busy(btn,true,"Saving");
        try{
          const r=await P.call("POST",{action:"confirm", idx:s.idx, ...em});
          if(!r.ok) throw new Error(r.error);
          Object.assign(me,{status:"Verified", verifiedOn:r.verifiedOn, schoolEmail:em.schoolEmail, personalEmail:em.personalEmail});
          P.closeSheet(); viewHome(); P.toast(again?"Saved":"Details confirmed");
        }catch(err){ fail(P.errText(err)); P.busy(btn,false); }
      });
    }
  });
}

/* ───────── report an issue ───────── */
const CATS=[
  {k:"name", t:"Name spelling", d:"My name is spelled wrongly"},
  {k:"index", t:"Index number", d:"My index number is wrong"},
  {k:"attendance", t:"Attendance record", d:"A class is marked wrongly"},
  {k:"other", t:"Something else", d:"Any other issue"}
];
function sheetReport(cat="name", sid=""){
  const s=me, classes=(s.attendance||[]);
  P.openSheet({
    title:"Report an Issue",
    left:`<button class="btn btn-plain" data-close type="button">Cancel</button>`,
    body:`
      <div>
        <div class="section-h" style="margin-top:0">What's the issue?</div>
        <div class="group" role="radiogroup" aria-label="Issue type">
          ${CATS.map(c=>`<button type="button" class="row choice" role="radio" aria-checked="${c.k===cat}" data-k="${c.k}">
            <span class="grow">${c.t}<span class="sub" style="display:block">${c.d}</span></span><span class="tick" aria-hidden="true">✓</span></button>`).join("")}
        </div>
      </div>
      <form id="fr" class="stack" novalidate>
        <div class="field" data-for="name"><label for="rName">Correct spelling of your full name</label>
          <input id="rName" class="input" autocomplete="name" maxlength="120" value="${esc(s.name)}"></div>
        <div class="field" data-for="index"><label for="rIdx">Your correct index number</label>
          <input id="rIdx" class="input mono" inputmode="numeric" maxlength="14" value="${esc(s.idx)}"></div>
        <div class="field" data-for="attendance"><label for="rSession">Which class?</label>
          <select id="rSession" class="input">
            ${classes.length?classes.map(c=>`<option value="${esc(c.id)}" ${c.id===sid?"selected":""}>${esc(P.fmtDate(c.date))} · ${esc(c.course)} (${esc(c.status)})</option>`).join(""):`<option value="">No classes recorded yet</option>`}
          </select></div>
        <div class="field"><label for="rMsg" id="rMsgL">Details</label>
          <textarea id="rMsg" class="input" maxlength="600" placeholder="Tell the class rep what's wrong"></textarea></div>
        <div class="field"><label for="rMail">Your email, so the class rep can reply</label>
          <input id="rMail" class="input" type="email" inputmode="email" autocomplete="email" maxlength="120" value="${esc(s.personalEmail||"")}" placeholder="you@gmail.com"></div>
        <div id="serr" class="banner err" hidden role="alert"><span class="ic">!</span><span id="serrT"></span></div>
        <button class="btn btn-filled" id="send" type="submit">Send to Class Rep</button>
      </form>`,
    onMount(sc){
      let current=cat;
      const sync=()=>{
        sc.querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-checked", String(b.dataset.k===current)));
        sc.querySelectorAll("[data-for]").forEach(f=>f.hidden = f.dataset.for!==current);
        $("#rMsgL").textContent = (current==="name"||current==="index") ? "Anything else (optional)" : "Details";
        $("#rMsg").placeholder = current==="attendance" ? "e.g. I was in class but marked absent" : "Tell the class rep what's wrong";
        $("#serr").hidden=true;
      };
      sc.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ current=b.dataset.k; sync(); });
      sync();
      $("#fr").addEventListener("submit", async e=>{
        e.preventDefault();
        const fail=t=>{ $("#serrT").textContent=t; $("#serr").hidden=false; };
        const msg=$("#rMsg").value.trim(), mail=$("#rMail").value.trim().toLowerCase();
        const payload={action:"feedback", idx:s.idx, category:current, message:msg, contactEmail:mail};
        if(mail && !P.EMAIL_RE.test(mail)) return fail("Your email doesn't look right.");
        if(current==="name"){ const n=$("#rName").value.trim(); if(!n) return fail("Enter your full name."); if(n===s.name) return fail("That's the same as the name on the list. Change it to the correct spelling."); payload.newName=n; }
        if(current==="index"){ const i=$("#rIdx").value.replace(/\s+/g,""); if(!/^\d{8,12}$/.test(i)) return fail("Index number should be digits only (usually 10 digits)."); if(i===s.idx) return fail("That's the same index number. Enter the correct one."); payload.newIdx=i; }
        if(current==="attendance"){ if(!classes.length) return fail("No classes have been recorded yet."); payload.sessionId=$("#rSession").value; }
        if((current==="attendance"||current==="other") && !msg) return fail("Tell the class rep what the issue is.");
        const btn=$("#send"); P.busy(btn,true,"Sending");
        try{
          const r=await P.call("POST",payload);
          if(!r.ok) throw new Error(r.error);
          if(current==="name"||current==="index") me.status="Correction requested";
          P.closeSheet(); viewHome(); P.toast("Sent to the class rep");
        }catch(err){ fail(P.errText(err)); P.busy(btn,false); }
      });
    }
  });
}

/* ───────── missing from list ───────── */
function sheetMissing(idx=""){
  P.openSheet({
    title:"Not on the List",
    left:`<button class="btn btn-plain" data-close type="button">Cancel</button>`,
    body:`
      <p class="hint" style="margin:0">If you're in this class but can't find yourself, send your details and the class rep will add you.</p>
      <form id="fm" class="stack" novalidate>
        <div class="field"><label for="mName">Full name</label><input id="mName" class="input" autocomplete="name" maxlength="120"></div>
        <div class="field"><label for="mIdx">Index number</label><input id="mIdx" class="input mono" inputmode="numeric" maxlength="14" value="${esc(idx)}"></div>
        ${emailFields()}
        <div id="serr" class="banner err" hidden role="alert"><span class="ic">!</span><span id="serrT"></span></div>
        <button class="btn btn-filled" id="send" type="submit">Send to Class Rep</button>
      </form>`,
    onMount(){
      $("#fm").addEventListener("submit", async e=>{
        e.preventDefault();
        const fail=t=>{ $("#serrT").textContent=t; $("#serr").hidden=false; };
        const n=$("#mName").value.trim(), i=$("#mIdx").value.replace(/\s+/g,"");
        if(!n) return fail("Enter your full name.");
        if(!/^\d{8,12}$/.test(i)) return fail("Index number should be digits only (usually 10 digits).");
        const em=readEmails(); if(em.error) return fail(em.error);
        const btn=$("#send"); P.busy(btn,true,"Sending");
        try{
          const r=await P.call("POST",{action:"missing", idx:i, name:n, ...em});
          if(!r.ok) throw new Error(r.error);
          P.closeSheet(); P.toast("Sent to the class rep");
        }catch(err){ fail(P.errText(err)); P.busy(btn,false); }
      });
    }
  });
}

/* ───────── start ───────── */
P.mountLogo();
const saved=store.get();
if(saved){ viewLookup(saved); lookup(saved, $("#go")); } else viewLookup();
</script>
